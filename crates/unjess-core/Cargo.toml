[package]
name = "unjess-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "fs", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.17"

