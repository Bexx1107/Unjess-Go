[package]
name = "unjess-desktop"
version = "3.1.5"
edition = "2024"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

[build-dependencies]
winres = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "z"

